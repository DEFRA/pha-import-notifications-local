info:
  name: import-notifications
  type: folder
  seq: 2

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{token_url}}/oauth2/token"
    credentials:
      clientId: "{{client_id}}"
      clientSecret: "{{client_secret}}"
      placement: body
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
