services:
  localstack:
    image: localstack/localstack:4.11.1
    environment:
      - LOCALSTACK_HOST=localhost
      - SERVICES=s3,sqs,sns,dynamodb
      - LS_LOG=WARN
    env_file:
      - ./config/defaults.env
    volumes:
      - ./scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/READY"]
      interval: 5s
      start_period: 10s
      retries: 12
    ports:
      - "4566:4566"

  mongodb:
    image: mongo:6.0.13
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 5s
      start_period: 5s
      retries: 3
    ports:
      - "27017:27017"

  trade-imports-data-api-stub:
    image: defradigital/trade-imports-data-api-stub:${TRADE_IMPORTS_DATA_API_STUB:-latest}
    env_file:
      - ./config/defaults.env
      - ./config/trade-imports-data-api-stub.env
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8085/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "8085:8085"

  pha-import-notifications:
    image: defradigital/pha-import-notifications:${PHA_IMPORT_NOTIFICATIONS:-latest}
    env_file:
      - ./config/defaults.env
      - ./config/pha-import-notifications.env
    depends_on:
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      trade-imports-data-api-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "8080:8080"
